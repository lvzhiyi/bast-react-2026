variables:
  # Full history is required so Turborepo can calculate accurate git diffs for --affected.
  GIT_DEPTH: '0'
  PNPM_STORE_DIR: '.pnpm-store'
  TURBO_TELEMETRY_DISABLED: '1'

stages:
  - detect
  - verify
  - deploy

.pnpm-base:
  image: node:22-alpine
  before_script:
    - apk add --no-cache git
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/
    policy: pull-push

ci:mr-verify:
  stage: verify
  extends: .pnpm-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      BASE_REF="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE_REF" ] || echo "$BASE_REF" | grep -Eq '^0+$'; then
        BASE_REF="origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}"
      fi
      node scripts/affected-apps.mjs --base "$BASE_REF" --format pretty
      TURBO_SCM_BASE="$BASE_REF" pnpm exec turbo run typecheck lint build --affected

cd:detect-affected:
  stage: detect
  extends: .pnpm-base
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  script:
    - |
      # Compare against CI_COMMIT_BEFORE_SHA (affected-apps.mjs fails open to all apps if null/missing).
      # Tip: once you configure a GitLab CI push token, switch to per-app deploy marker tags:
      #   ENV="staging"; [ "$CI_COMMIT_BRANCH" = "main" ] && ENV="production"
      #   node scripts/affected-apps.mjs --mode deploy-tags --tag-prefix "deploy/${ENV}/" --dotenv affected.env --format pretty
      node scripts/affected-apps.mjs \
        --base "${CI_COMMIT_BEFORE_SHA:-}" \
        --dotenv affected.env \
        --format pretty
  artifacts:
    reports:
      dotenv: affected.env

.deploy-app-base:
  stage: deploy
  extends: .pnpm-base
  needs:
    - job: cd:detect-affected
      optional: true
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        SHOULD_DEPLOY="true"
        DEPLOY_ENV="production"
      else
        eval "SHOULD_DEPLOY=\${${DEPLOY_FLAG}:-false}"
        DEPLOY_ENV="staging"
        if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
          DEPLOY_ENV="production"
        fi
      fi

      if [ "$SHOULD_DEPLOY" != "true" ]; then
        echo "Skip ${APP_NAME}: not affected by this commit."
        exit 0
      fi

      echo "Building and deploying ${APP_NAME} (${APP_DIR}) to ${DEPLOY_ENV}..."
      pnpm exec turbo run build --filter="${APP_NAME}..."
      # Replace with your actual deployment command, e.g.:
      # rsync -avz --delete "apps/${APP_DIR}/dist/" "deploy@host:/var/www/${APP_DIR}/"
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - apps/${APP_DIR}/dist

deploy:platform-admin:
  extends: .deploy-app-base
  variables:
    APP_NAME: '@repo/platform-admin'
    APP_DIR: 'platform-admin'
    DEPLOY_FLAG: 'DEPLOY_PLATFORM_ADMIN'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^platform-admin@v/'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

deploy:merchant-portal:
  extends: .deploy-app-base
  variables:
    APP_NAME: '@repo/merchant-portal'
    APP_DIR: 'merchant-portal'
    DEPLOY_FLAG: 'DEPLOY_MERCHANT_PORTAL'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^merchant-portal@v/'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

deploy:partner-console:
  extends: .deploy-app-base
  variables:
    APP_NAME: '@repo/partner-console'
    APP_DIR: 'partner-console'
    DEPLOY_FLAG: 'DEPLOY_PARTNER_CONSOLE'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^partner-console@v/'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
